name: "Nix Flake Check"
on:
  push:
  pull_request:
jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install nix
        uses: https://github.com/cachix/install-nix-action@v31
      - name: Format and lint
        run: nix build --print-build-logs .#checks.x86_64-linux.pre-commit
      - name: Evaluate configurations
        run: nix develop --command fish ./tests/eval.fish
