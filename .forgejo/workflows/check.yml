name: "Check"
on:
  push:
  pull_request:
jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install nix
        uses: https://github.com/cachix/install-nix-action@v31
      # - run: nix build
      - name: Flake check
        run: nix flake check
