name: "Update flake.lock"
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
jobs:
  update:
    runs-on: nix
    env:
      BRANCH: flake-update
    steps:
      # The host runner has no git, without which checkout downloads a
      # tarball that can't be committed to.
      - name: Install git
        run: echo "$(nix build --no-link --print-out-paths nixpkgs#git)/bin" >> "$GITHUB_PATH"
      # A personal access token rather than the automatic one: Forgejo doesn't
      # start workflows for pushes or pull requests made with the automatic
      # token, so check.yml would never run on the pull request and it could
      # never merge into the protected main.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main
          token: ${{ secrets.FLAKE_UPDATE_TOKEN }}
      - name: Set up access to nix-private
        env:
          NIX_PRIVATE_SSH_KEY: ${{ secrets.NIX_PRIVATE_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$NIX_PRIVATE_SSH_KEY" > ~/.ssh/nix-private
          chmod 600 ~/.ssh/nix-private
          echo '[fj.dellhplaptop.xyz]:2222 ssh-rsa ' > ~/.ssh/known_hosts_forgejo
          echo "GIT_SSH_COMMAND=ssh -i $HOME/.ssh/nix-private -o IdentitiesOnly=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts_forgejo -o StrictHostKeyChecking=yes" >> "$GITHUB_ENV"
      - name: Log in to attic
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: |
          if [ -n "$ATTIC_TOKEN" ]; then
            nix develop --command attic login nas https://attic.nas.dellhp.party "$ATTIC_TOKEN"
          fi
      # The secrets input is left out: it's bumped by hand in its own commit
      # after rekeying.
      - name: Update flake.lock
        id: update
        run: |
          inputs=$(jq -r '.nodes.root.inputs | keys[] | select(. != "secrets")' flake.lock)
          nix flake update $inputs 2> update.log
          cat update.log
          if git diff --quiet flake.lock; then
            echo "flake.lock is already up to date"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build configurations
        if: steps.update.outputs.changed == 'true'
        run: nix develop --command just test
      - name: Push and open pull request
        if: steps.update.outputs.changed == 'true'
        env:
          TOKEN: ${{ secrets.FLAKE_UPDATE_TOKEN }}
        run: |
          git config user.name "forgejo-actions"
          git config user.email "forgejo-actions@noreply.fj.dellhplaptop.xyz"
          grep -E "^• Updated input|^    '|^  →" update.log > changes.txt || true
          printf 'flake: bump inputs\n\n%s\n' "$(cat changes.txt)" > commit-msg
          git commit -F commit-msg flake.lock
          git push --force origin "HEAD:refs/heads/$BRANCH"

          api="$GITHUB_SERVER_URL/api/v1/repos/$GITHUB_REPOSITORY"
          auth="Authorization: token $TOKEN"
          open=$(curl -fsS -H "$auth" "$api/pulls?state=open&limit=50" \
            | jq --arg b "$BRANCH" '[.[] | select(.head.ref == $b)] | length')
          if [ "$open" -gt 0 ]; then
            echo "Pull request already open; pushed the new lock to it"
          else
            jq -n --arg b "$BRANCH" --rawfile body changes.txt '{
              base: "main",
              head: $b,
              title: "flake: bump inputs",
              body: ("Automated `nix flake update` (all inputs except `secrets`); `just test` passed.\n\n```\n" + $body + "```\n")
            }' | curl -fsS -X POST -H "$auth" -H "Content-Type: application/json" \
              --data @- "$api/pulls" > /dev/null
            echo "Opened pull request from $BRANCH into main"
          fi
